<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% if songs|length == 0 %}
        <p>No songs</p>
    {% else %}
        <ul>
            {% for song in songs%}
                <li>{{song.title}}</li>
            {%endfor%}
        </ul>
        <p>No songs found</p>
    {% endif%}
</body>
</html>
